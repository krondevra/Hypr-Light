# The reference machine's hyprpaper.conf hardcoded an absolute wallpaper
# path from that specific machine (~/Archive/Media/Wallpapers/...), which
# won't exist on a fresh install/VM. No wallpaper image ships in this repo,
# so this is left as a template - add your own monitor + path entries:
#
# wallpaper {
#     monitor =
#     path = /path/to/your/wallpaper.jpg
#     fit_mode = contain
# }
